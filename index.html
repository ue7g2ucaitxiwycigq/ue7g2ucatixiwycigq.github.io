<!DOCTYPE html>
<html lang="en">

<style>
  * {

  body {

    padding: 0;
    line-height: 1.5;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(

      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.15) 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  .container {

    margin: 40px auto;
    background-color: #060a06;
    border: 1px solid #1f7a3f;
    padding: 0;
  }

  .titlebar {
    background-color: #0f1f0f;
    border-bottom: 1px solid #1f7a3f;
    padding: 8px 14px;

    display: flex;
    justify-content: space-between;
    letter-spacing: 1px;
  }

  .body-inner {
    padding: 30px 35px;

  h1 {
