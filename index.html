<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Got Your IP</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 90%;
      max-width: 520px;
      padding: 45px 30px;
      text-align: center;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: 2px;
    }
    p {
      color: #999;
      line-height: 1.6;
    }
    .notice {
      margin-top: 20px;
      padding: 15px;
      background: #181818;
      border-radius: 10px;
      color: #aaa;
      font-size: 14px;
    }
    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: 0;
      border-radius: 9px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:55px;">👀</div>
    <h1>I GOT YOUR IP</h1>
    <p>
      This website can detect your public IP address.
    </p>
    <div class="notice">
      By clicking the button below, you agree to allow this
      website to process your public IP address and notify
      the website owner.
    </div>
    <button id="btn" onclick="getIP()">
      I Agree & Continue
    </button>
    <div id="result"></div>
  </div>
  <script>
    async function getIP() {
      const button = document.getElementById("btn");
      const result = document.getElementById("result");
      button.disabled = true;
      result.textContent = "Getting your IP...";
      try {
        const ipResponse = await fetch("/ip");
        if (!ipResponse.ok) {
          throw new Error("IP request failed");
        }
        const ipData = await ipResponse.json();
        result.textContent = "Your IP: " + ipData.ip;
        // Send notification to Telegram
        const telegramResponse = await fetch("/telegram", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            ip: ipData.ip
          })
        });
        if (!telegramResponse.ok) {
          console.error("Telegram notification failed");
        }
      } catch (error) {
        console.error(error);
        result.textContent = "Something went wrong.";
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
